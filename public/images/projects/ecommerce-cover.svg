<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="E-Commerce UI Clone — learning project, no live deployment">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1A1612" stroke-opacity="0.1" stroke-width="2"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1A1612" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#FDF6E3"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <rect x="90" y="96" width="1020" height="608" fill="#FDF6E3" stroke="#1A1612" stroke-width="6"/>
  <rect x="118" y="152" width="470" height="72" fill="#A78BFA" stroke="#1A1612" stroke-width="6" transform="rotate(1.6 353 188)"/>

  <text x="150" y="200" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#1A1612" letter-spacing="3">LEARNING PROJECT</text>

  <g transform="rotate(1.2 600 400)">
    <rect x="150" y="300" width="580" height="118" fill="#FF8C2A" stroke="#1A1612" stroke-width="6"/>
    <rect x="158" y="308" width="564" height="102" fill="none" stroke="#1A1612" stroke-width="2"/>
  </g>
  <text x="186" y="382" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" fill="#1A1612" letter-spacing="-1">E-COMMERCE</text>
  <text x="186" y="452" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" fill="#1A1612" letter-spacing="-1">UI CLONE</text>

  <rect x="790" y="300" width="260" height="152" fill="#FFD43B" stroke="#1A1612" stroke-width="6" transform="rotate(-2 920 376)"/>
  <text x="920" y="368" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="bold" fill="#1A1612">REBUILD</text>
  <text x="920" y="404" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="bold" fill="#1A1612">FOR PRACTICE</text>

  <g font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#1A1612">
    <rect x="150" y="516" width="186" height="58" fill="#4ADE80" stroke="#1A1612" stroke-width="6"/>
    <text x="243" y="554" text-anchor="middle">Next.js</text>

    <rect x="354" y="516" width="242" height="58" fill="#3B82F6" stroke="#1A1612" stroke-width="6"/>
    <text x="475" y="554" text-anchor="middle">Tailwind CSS</text>

    <rect x="614" y="516" width="216" height="58" fill="#FF6B9D" stroke="#1A1612" stroke-width="6"/>
    <text x="722" y="554" text-anchor="middle">Local State</text>
  </g>

  <rect x="150" y="620" width="600" height="52" fill="#FFEBCD" stroke="#1A1612" stroke-width="6" transform="rotate(0.7 450 646)"/>
  <text x="182" y="654" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#1A1612" letter-spacing="1">NOT A CLIENT PROJECT — SELF-DIRECTED</text>

  <rect x="1000" y="600" width="90" height="90" fill="url(#dots)" stroke="#1A1612" stroke-width="6"/>
</svg>
