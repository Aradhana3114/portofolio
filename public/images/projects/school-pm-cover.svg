<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="School Project Management System — class assignment, no live deployment">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1A1612" stroke-opacity="0.1" stroke-width="2"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1A1612" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#FDF6E3"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <rect x="90" y="96" width="1020" height="608" fill="#FDF6E3" stroke="#1A1612" stroke-width="6"/>
  <rect x="118" y="152" width="480" height="72" fill="#4ADE80" stroke="#1A1612" stroke-width="6" transform="rotate(-2 358 188)"/>

  <text x="150" y="200" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#1A1612" letter-spacing="3">CLASS ASSIGNMENT</text>

  <g transform="rotate(-1.4 600 400)">
    <rect x="150" y="300" width="640" height="118" fill="#FFD43B" stroke="#1A1612" stroke-width="6"/>
    <rect x="158" y="308" width="624" height="102" fill="none" stroke="#1A1612" stroke-width="2"/>
  </g>
  <text x="186" y="382" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" fill="#1A1612" letter-spacing="-1">SCHOOL PROJECT</text>
  <text x="186" y="452" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" fill="#1A1612" letter-spacing="-1">MANAGEMENT</text>

  <rect x="810" y="300" width="240" height="152" fill="#3B82F6" stroke="#1A1612" stroke-width="6" transform="rotate(2 930 376)"/>
  <text x="930" y="368" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="bold" fill="#1A1612">PPLG</text>
  <text x="930" y="404" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="bold" fill="#1A1612">2025</text>

  <g font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#1A1612">
    <rect x="150" y="516" width="150" height="58" fill="#FF6B9D" stroke="#1A1612" stroke-width="6"/>
    <text x="225" y="554" text-anchor="middle">React</text>

    <rect x="318" y="516" width="176" height="58" fill="#A78BFA" stroke="#1A1612" stroke-width="6"/>
    <text x="406" y="554" text-anchor="middle">Node.js</text>

    <rect x="512" y="516" width="152" height="58" fill="#FF8C2A" stroke="#1A1612" stroke-width="6"/>
    <text x="588" y="554" text-anchor="middle">MySQL</text>

    <rect x="682" y="516" width="242" height="58" fill="#FFD43B" stroke="#1A1612" stroke-width="6"/>
    <text x="803" y="554" text-anchor="middle">Tailwind CSS</text>
  </g>

  <rect x="150" y="620" width="560" height="52" fill="#FFEBCD" stroke="#1A1612" stroke-width="6" transform="rotate(-0.8 430 646)"/>
  <text x="182" y="654" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#1A1612" letter-spacing="1">NO PUBLIC DEPLOYMENT — SCHOOL ONLY</text>

  <rect x="1000" y="600" width="90" height="90" fill="url(#dots)" stroke="#1A1612" stroke-width="6"/>
</svg>
